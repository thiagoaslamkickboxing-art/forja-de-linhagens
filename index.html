<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Forja de Linhagens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: duas telas (mapa de fases e batalha). Batalha: HUD fino, tabuleiro no meio, inspetor e bandeja embaixo. Mundo único, escuro. */
  --ink:#0e1815; --moss:#182a24; --moss2:#21382f; --line:#35554a;
  --parch:#ece2c6; --dim:#a9b3a0; --gold:#e4b548; --blood:#d0604a;
  --display:"Grenze Gotisch","Alegreya Sans",Georgia,serif;
  --body:"Alegreya Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--ink);color:var(--parch);font-family:var(--body);font-size:15px;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.btn{padding:7px 12px;border:1px solid var(--line);border-radius:4px;background:var(--moss2);font-weight:700;font-size:14px;white-space:nowrap;text-align:center}
.btn.go{background:var(--gold);color:#1b1a12;border-color:var(--gold)}
.btn[disabled]{opacity:.45;cursor:default;filter:grayscale(1)}
.btn[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
canvas.ico{display:block}

/* ---- mapa ---- */
#home,#game{height:100%;display:none;flex-direction:column}
body.home #home,body.game #game{display:flex}
#home{overflow-y:auto;padding:0 16px 20px;gap:14px}
.top{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding-top:14px}
.top h1{font-family:var(--display);font-weight:700;font-size:clamp(22px,6vw,32px);line-height:1;color:var(--gold);margin-right:auto;text-wrap:balance}
.lvl{display:flex;gap:12px;align-items:center;background:var(--moss);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.badge{flex:none;width:58px;height:58px;border-radius:50%;border:2px solid var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;background:var(--moss2)}
.badge small{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.badge b{font-family:var(--display);font-size:28px;color:var(--gold)}
.xp{flex:1;min-width:0;font-size:13px;line-height:1.3;color:var(--dim)}
.xp b{color:var(--parch)}
.xpbar{height:8px;border-radius:4px;background:#0a120f;overflow:hidden;margin-bottom:5px}
.xpbar i{display:block;height:100%;background:var(--gold);width:0}
#phases{display:flex;flex-direction:column;gap:8px}
.ph{display:flex;align-items:stretch;gap:0;background:var(--moss);border:1px solid var(--line);border-radius:6px;overflow:hidden;width:100%}
.ph .sw{flex:none;width:54px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:26px;color:#fff;text-shadow:0 1px 3px #000a}
.ph .tx{flex:1;min-width:0;padding:9px 12px}
.ph .nm{font-family:var(--display);font-size:20px;line-height:1.1}
.ph .mt{font-size:13px;color:var(--dim)}
.ph .st{flex:none;align-self:center;padding-right:12px;font-size:18px;letter-spacing:2px;color:var(--gold);white-space:nowrap}
.ph .st s{text-decoration:none;color:var(--line)}
.ph.lock{opacity:.5}
.ph:not(.lock):active{border-color:var(--gold)}
.coins,.gems{display:flex;align-items:center;gap:5px;font-weight:700;font-size:15px;flex:none}
.coins{color:var(--gold)}.gems{color:#d79bff}
.coins i,.cico{width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff2b0,#e4b548 55%,#a87a1c);border:1px solid #6b4e12;display:inline-block;vertical-align:-2px;flex:none}
.gico{width:16px;height:16px;display:inline-block;vertical-align:-3px;flex:none}
.tabs{display:flex;gap:5px}
.tabs button{flex:1;padding:8px 2px;border:1px solid var(--line);border-radius:4px;background:var(--moss);font-weight:700;font-size:13px;text-align:center;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--gold);color:#1b1a12;border-color:var(--gold)}
.tabs em{font-style:normal;background:var(--blood);color:#fff;border-radius:99px;padding:0 5px;font-size:11px;margin-left:2px}
.tabs em:empty{display:none}
#tabF,#tabH,#tabB,#tabL,#tabM{display:none;flex-direction:column;gap:10px}
#home[data-tab="F"] #tabF,#home[data-tab="H"] #tabH,#home[data-tab="B"] #tabB,#home[data-tab="L"] #tabL,#home[data-tab="M"] #tabM{display:flex}
.shopBar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;background:var(--moss);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13px;color:var(--dim)}
.shopBar b{color:var(--parch)}
.shopBar .btn{display:flex;align-items:center;gap:5px}
.shopGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.shc{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 8px 8px;background:var(--moss);border:2px solid var(--line);border-radius:6px;text-align:center}
.shc.bought{opacity:.58}
.shc.popBuy{animation:buyPop .4s ease}
.shc .tag{position:absolute;top:5px;left:5px;font-size:9px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:1px 5px;border-radius:3px;background:#1b1a12;color:var(--gold);border:1px solid var(--line)}
.shc .nm{font-weight:700;font-size:13px;line-height:1.15;min-height:2.2em;display:flex;align-items:center;justify-content:center}
.shc .qt{font-size:12px;color:var(--dim)}
.shc .qt b{color:var(--parch)}
.shc .btn{width:100%;margin-top:auto;display:flex;align-items:center;justify-content:center;gap:5px;padding:6px 8px}
.shc s{color:var(--dim);font-weight:400;font-size:12px;margin-right:2px}
.shopFix{display:flex;flex-direction:column;gap:8px}
.shRow{display:flex;align-items:center;gap:10px;background:var(--moss);border:1px solid var(--line);border-radius:6px;padding:9px 12px}
.shRow.popBuy{animation:buyPop .4s ease}
.shRow .tx{flex:1;min-width:0}.shRow .nm{font-family:var(--display);font-size:19px;line-height:1.1}.shRow .mt{font-size:12px;color:var(--dim)}
.shRow .btn{display:flex;align-items:center;gap:5px;flex:none}
#hToast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--parch);color:#1b1a12;padding:7px 14px;border-radius:6px;font-weight:700;font-size:14px;box-shadow:0 6px 20px #000a;opacity:0;pointer-events:none;transition:opacity .2s;z-index:8;text-align:center;max-width:calc(100% - 32px)}
#hToast.on{opacity:1}
@keyframes buyPop{0%{transform:scale(1)}35%{transform:scale(1.05);box-shadow:0 0 16px #e4b54899}100%{transform:scale(1)}}
.secT{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between}
#deck{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.slot{aspect-ratio:1;border:1px dashed var(--line);border-radius:4px;background:var(--moss);display:flex;align-items:center;justify-content:center;color:var(--line);font-size:20px;overflow:hidden;padding:0}
.slot.full{border-style:solid;border-width:2px}
.slot canvas{width:100%!important;height:100%!important}
#coll{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.hc{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px 7px;background:var(--moss);border:1px solid var(--line);border-top:3px solid var(--line);border-radius:4px}
.hc .nm{font-size:12px;line-height:1.1;text-align:center;font-weight:700;min-height:2.2em;display:flex;align-items:center}
.hc .rr{font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.hc .pb{width:86%;height:6px;border-radius:3px;background:#0a120f;overflow:hidden}
.hc .pb i{display:block;height:100%;background:var(--gold)}
.hc .pb.ok i{background:#7bd957}
.hc .ct{font-size:11px;color:var(--dim)}
.hc .dk{position:absolute;top:4px;right:4px;font-size:9px;letter-spacing:.08em;background:var(--gold);color:#1b1a12;border-radius:2px;padding:0 4px;font-weight:700}
.hc.lock{opacity:.55}
.ch{display:flex;gap:12px;align-items:center;background:var(--moss);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.ch .tx{flex:1;min-width:0}
.ch .nm{font-family:var(--display);font-size:20px;line-height:1.1}
.ch .mt{font-size:13px;color:var(--dim);line-height:1.3}
.ch .bt{display:flex;flex-direction:column;gap:6px;flex:none}
#heroBody{padding:0 16px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
#heroTop{display:flex;gap:12px;align-items:center}
#heroDesc{font-size:14px;color:var(--dim);line-height:1.3}
#heroProg{font-size:13px;color:var(--parch)}
.hBtns{display:flex;gap:8px;flex-wrap:wrap}
.hBtns .btn{flex:1}
#lootList{padding:0 16px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.lt{display:flex;gap:10px;align-items:center;padding:6px 10px;background:var(--moss2);border-left:3px solid var(--line);border-radius:2px;animation:pop .35s both}
.lt .n{font-weight:700;line-height:1.15}.lt .d{font-size:12px;color:var(--dim)}
.lt .new{margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.08em;color:#1b1a12;background:var(--gold);padding:1px 6px;border-radius:2px;flex:none}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.lt{animation:none}}

/* ---- batalha ---- */
#game{background:#0b0f0d}
#hud{display:flex;align-items:center;gap:8px;padding:6px 10px;background:linear-gradient(#2a2117,#17120c);border-bottom:2px solid #6b5426;flex:none}
.rbtn{flex:none;width:40px;height:40px;border-radius:10px;border:2px solid #6b5426;background:linear-gradient(#3b3326,#221c14);color:var(--parch);font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center}
#hMid{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;line-height:1.05}
#hName{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#vWave{font-family:var(--display);font-size:21px;color:var(--parch)}
#wProg{width:100%;max-width:150px;height:5px;border-radius:3px;background:#0008;overflow:hidden;margin-top:2px}
#wProg i{display:block;height:100%;width:0;background:var(--gold)}
.pill{flex:none;display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;border:2px solid #6b5426;background:#0007;font-weight:700;font-size:17px}
.pill i{font-style:normal;font-size:14px}
#pCastle i{color:#e0604a}#pGold i{color:var(--gold)}
#stage{flex:1;min-height:0;position:relative;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#hint{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 110px);background:#000c;border:1px solid var(--gold);color:var(--parch);padding:6px 10px;border-radius:8px;font-size:13px;line-height:1.3;text-align:center;pointer-events:none}
#hint b{color:var(--gold)}
#toast{position:absolute;left:50%;top:52px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 110px);background:var(--parch);color:#1b1a12;padding:6px 12px;border-radius:6px;font-weight:700;font-size:14px;text-align:center;box-shadow:0 6px 20px #0008;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
#toast span{display:block;font-weight:400;font-size:12px}
#orders{position:absolute;left:6px;top:8px;display:flex;flex-direction:column;gap:8px}
.ord{width:44px;height:44px;border-radius:50%;border:2px solid #6b5426;background:#000a;color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;position:relative}
.ord.ready{border-color:var(--gold);box-shadow:0 0 10px #e4b54888}
.ord.on{border-color:#7bd957;box-shadow:0 0 12px #7bd957}
.ord em{position:absolute;inset:-2px;border-radius:50%;pointer-events:none}
#tipc{position:absolute;display:none;width:200px;background:linear-gradient(#2a2117,#17120c);border:2px solid #6b5426;border-radius:10px;padding:8px;box-shadow:0 8px 24px #000a;z-index:2}
#tipc.on{display:block}
#tipc .tt{display:flex;gap:8px;align-items:center}
#tipc .nm{font-family:var(--display);font-size:17px;line-height:1.05}
#tipc .sub{font-size:11px;color:var(--dim)}
#tipc .stt{font-size:12px;margin:6px 0;color:var(--parch);line-height:1.35}
#tipc .btn{width:100%;padding:6px}
#bar{flex:none;display:flex;align-items:center;gap:10px;padding:8px 10px 10px;background:linear-gradient(#2a2117,#120e09);border-top:2px solid #6b5426}
.round{flex:none;width:62px;height:62px;border-radius:50%;border:3px solid #6b5426;background:radial-gradient(circle at 50% 35%,#3a3125,#15110b);color:var(--parch);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;font-weight:700;font-size:11px;position:relative}
.round b{font-size:20px}
.round em{position:absolute;inset:-3px;border-radius:50%;pointer-events:none}
#bSpell.ready{border-color:#ff8a3c;box-shadow:0 0 14px #ff8a3c;color:#ffd24a}
#bSpell[aria-pressed="true"]{background:#5a1d0e}
#bWave.call{border-color:var(--gold);color:var(--gold)}
#bWave[disabled]{opacity:.55}
#bSummon{flex:1;height:62px;border-radius:14px;border:3px solid #a87a1c;background:linear-gradient(#ffe189,#e4b548 55%,#c08e25);color:#2a1d05;font-family:var(--display);font-size:24px;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 0 #6b4e12,0 6px 14px #0008}
#bSummon small{font-family:var(--body);font-size:15px;font-weight:700}
#bSummon:active{transform:translateY(3px);box-shadow:0 1px 0 #6b4e12}
#bSummon.poor{filter:grayscale(.7) brightness(.7)}
#pause .panel{align-self:center;border-radius:10px;border-bottom:1px solid var(--line);padding-bottom:14px}
#pause .pb2{display:flex;flex-direction:column;gap:8px;padding:0 16px}
#pause .pb2 .btn{padding:10px}
#iFx,.fx{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.chip{font-size:11px;padding:1px 7px;border:1px solid var(--line);border-radius:99px;background:var(--moss2);white-space:nowrap}
.qs{display:flex;gap:10px;align-items:center;background:var(--moss);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.qs .tx{flex:1;min-width:0}.qs .nm{font-weight:700;line-height:1.2}.qs .mt{font-size:12px;color:var(--dim)}
.qs .pb{height:6px;border-radius:3px;background:#0a120f;overflow:hidden;margin-top:5px}.qs .pb i{display:block;height:100%;background:var(--gold)}
.qs.done{opacity:.55}

/* ---- folhas ---- */
.sheet{position:fixed;inset:0;background:#070d0bcc;display:none;align-items:flex-end;justify-content:center;z-index:5}
.sheet.on{display:flex}
.panel{background:var(--moss);border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;width:min(560px,100%);max-height:90%;display:flex;flex-direction:column}
.panel header{display:flex;align-items:baseline;gap:10px;padding:14px 16px 8px}
.panel h2{font-family:var(--display);font-size:26px;color:var(--gold);line-height:1;margin-right:auto}
.panel .sub{font-size:13px;color:var(--dim);padding:0 16px 8px;line-height:1.3}
#gList{overflow-y:auto;padding:0 16px 16px;display:flex;flex-direction:column;gap:6px}
#grim,#hero,#loot,#codes{z-index:6}
#codes .panel{padding-bottom:16px}
.cForm{display:flex;gap:8px;padding:0 16px 10px}
.cForm input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:#0a120f;color:var(--parch);font:inherit;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.cForm input:focus{outline:2px solid var(--gold);border-color:var(--gold)}
#cRes{padding:0 16px;min-height:24px}
.cBox{padding:10px 12px;border-radius:6px;background:var(--moss2);border:1px solid var(--line);animation:pop .32s both}
.cBox.ok{border-color:var(--gold);background:#263828}
.cBox.err{border-color:var(--blood);color:#ff9b8a;text-align:center;font-weight:700}
.cBox .ctit{font-family:var(--display);font-size:19px;color:var(--gold);margin-bottom:6px}
.cBox .citems{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cBox .cit{display:flex;align-items:center;gap:6px;padding:4px 9px;border-radius:4px;background:var(--moss);border:1px solid var(--line);font-weight:700;font-size:14px}
#gList h3{font-family:var(--display);font-size:18px;color:var(--parch);margin-top:8px;font-weight:500}
.row{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;background:var(--moss2);border-left:3px solid var(--line);border-radius:2px}
.row .g{width:52px;flex:none}
.row .n{font-family:var(--display);font-size:18px;line-height:1.1}
.row .d{font-size:13px;color:var(--dim);line-height:1.25}
.row .p{font-size:12px;color:var(--gold)}
.rslots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.rslot{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;background:var(--moss);border:1px solid var(--line);border-radius:4px}
.rslot.off{opacity:.55}
.rslot span{font-size:10px;letter-spacing:.03em;font-weight:700}
.sbon{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.sbon .chip.on{background:#3a2f12;color:var(--gold);border-color:var(--gold)}
.legend{font-size:12px;color:var(--dim);line-height:1.35;padding:8px 10px;border:1px dashed var(--line);border-radius:2px}
.legend b{color:var(--parch)}
#over{align-items:center;padding:16px}
#over .panel{border-bottom:1px solid var(--line);border-radius:8px;padding-bottom:16px;text-align:center}
#over header{justify-content:center}#over h2{margin:0}
#oStars{font-size:34px;letter-spacing:6px;color:var(--gold);line-height:1}
#oStars s{text-decoration:none;color:var(--line)}
#oText{padding:6px 16px 4px;color:var(--parch)}
#oUnl{padding:0 16px 12px;color:var(--gold);font-size:14px;line-height:1.35}
.oBtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 16px}
</style>
</head>
<body class="home">

<section id="home" data-tab="F">
  <div class="top">
    <h1>Forja de Linhagens</h1>
    <div class="coins" title="Moedas"><i></i><b class="num" id="hCoins">0</b></div>
    <div class="gems" title="Gemas"><svg class="gico" viewBox="0 0 24 24" aria-hidden="true"><polygon points="12,2 21,9 12,22 3,9" fill="#9b4dff" stroke="#2d0c57" stroke-width="1.8" stroke-linejoin="round"/><polygon points="12,2 16,9 12,22 8,9" fill="#c78bff" opacity=".7"/><polygon points="12,2 8,9 3,9" fill="#e9c8ff" opacity=".8"/><polygon points="12,2 21,9 16,9" fill="#6d22c9" opacity=".75"/></svg><b class="num" id="hGems">0</b></div>
    <button class="btn" id="hCodes">Códigos</button>
    <button class="btn" id="hSound" aria-pressed="true">Som</button>
  </div>
  <div class="lvl">
    <div class="badge"><small>Nível</small><b class="num" id="hLvl">1</b></div>
    <div class="xp"><div class="xpbar"><i id="hXp"></i></div><div id="hXpT"></div><div id="hNext"></div></div>
  </div>
  <div class="tabs">
    <button data-t="F" aria-selected="true">Fases</button><button data-t="H" aria-selected="false">Heróis</button><button data-t="B" aria-selected="false">Baús<em id="tbN"></em></button><button data-t="L" aria-selected="false">Loja</button><button data-t="M" aria-selected="false">Missões<em id="tmN"></em></button>
  </div>
  <div id="tabF"><div id="phases"></div></div>
  <div id="tabH">
    <button class="btn" id="hGrim">Abrir grimório de fusões</button>
    <div class="secT"><span>Deck de batalha</span><span id="deckN"></span></div><div id="deck"></div>
    <div class="secT"><span>Coleção</span><span id="collN"></span></div><div id="coll"></div>
  </div>
  <div id="tabB"><div id="chests" style="display:flex;flex-direction:column;gap:8px"></div></div>

function tone(type,f1,f2,dur,vol,delay){
  const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.02);
}
function noise(dur,vol,freq,kind,delay){
  if(!NB){NB=AC.createBuffer(1,AC.sampleRate*0.5,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
  const t=AC.currentTime+(delay||0),n=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  n.buffer=NB;f.type=kind||"bandpass";f.frequency.value=freq;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  n.connect(f);f.connect(g);g.connect(master);n.start(t);n.stop(t+dur+0.02);
}

}

function fusionOf(a,b){
  const A=C[a.cls],B=C[b.cls];
  if(A.tier!==B.tier)return{err:"Níveis diferentes",why:"Nível "+A.tier+" só funde com nível "+A.tier+"."};
  if(A.tier>=4)return{err:"Nível máximo",why:"Guerreiros de nível 4 não fundem mais."};
  const nt=A.tier+1;
  if(plvl()<FUSE_LV[nt])return{err:"Fusão bloqueada",why:"Fusão de nível "+nt+" abre no nível "+FUSE_LV[nt]+" de jogador."};
  const key=[A.s,B.s].sort().join("");
  const rar=fuseRar(a.rar,b.rar);
  const drop=RAR_V[rar]<Math.max(RAR_V[a.rar||"C"],RAR_V[b.rar||"C"]);
  return{id:RES[nt][key],rar,drop};
}

  sfx("fuse");puff(b.x,b.y,r.rar==="L"?28:16,RAR[r.rar].c,r.rar==="L"?2.4:1.9,r.rar==="L"?0.7:0.55,r.rar==="L"?0.07:0.06);G.arcs.push({ring:1,x:b.x,y:b.y,r:r.rar==="L"?1.3:0.9,t:0.3,h:r.rar==="L"?42:c.h2});

  recalc();sel=b;ui();

  if(!G||!d.moved||!G.units.includes(d.u)){placeTip();return}
  const cc=cellOf(d.px,d.py);if(!cc){placeTip();return}
  const t=unitAt(cc[0],cc[1]);
  if(!t){place(d.u,cc[0],cc[1]);recalc();if(G.tip===1)G.tip=2;ui()}
  else if(t!==d.u){if(fusionOf(d.u,t).err)swap(d.u,t);else fuse(d.u,t)}
  placeTip();
});
cv.addEventListener("pointercancel",()=>{drag=null});

/* ================= laço ================= */
let last=0,uiT=0;
function frame(t){
  const dt=Math.min(0.05,(t-last)/1000||0);last=t;
  if(G){
    for(let i=0;i<G.speed&&G;i++)step(dt);
    if(G){draw();uiT+=dt;if(uiT>0.15){uiT=0;tick()}}
  }
  requestAnimationFrame(frame);
}
setInterval(()=>{if(!document.body.classList.contains("home"))return;const el=$("shopTimer");if(el)el.textContent=fmtMidnight();if(P.shop&&P.shop.day!==today())renderHome()},1000);
function start(data){
  if(data&&data.v===3&&Array.isArray(data.units)&&PHASES[data.idx])startPhase(data.idx,data);else goHome();
  requestAnimationFrame(frame);
  const hot=window.claude&&window.claude.hot;
  if(hot&&hot.snapshot)hot.snapshot(()=>G&&!G.over?{v:3,idx:G.idx,gold:G.gold,lives:G.lives,wave:G.wave,summons:G.summons,xp:G.xp,seed:G.seed,units:G.units.map(u=>({c:u.cls,col:u.col,r:u.r,p:u.pw,rar:u.rar,lvf:u.lvf}))}:{});
}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{});
</script>
